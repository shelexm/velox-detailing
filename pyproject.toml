[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "velox"
version = "0.1.0"
description = "VELOX Detailing Studio: site, online booking, admin panel and Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic>=2.13,<2.14",  # aiogram 3.31 requires pydantic<2.14
    "pydantic-settings>=2.16",
    "jinja2>=3.1.6",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.32",
    "pillow>=13.0",
    "aiogram>=3.31",
    "tzdata>=2026.5",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "db: test needs the PostgreSQL test database",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/bot/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["design-reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "RUF001",  # Cyrillic text in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/conftest.py" = ["E402", "S101"]
"migrations/**" = ["E501"]
"scripts/**" = ["S603", "S607"]
